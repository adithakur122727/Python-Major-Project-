{% extends "base.html" %}
{% block title %}Order Placed - GymDesk{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-check-circle-fill display-1 text-success"></i>
  <h3 class="fw-bold mt-3">Order Placed Successfully!</h3>
  <p class="text-muted">Your Order ID is <strong>#{{ order.id }}</strong>. Pay cash on delivery when your order arrives.</p>
  <div class="d-flex justify-content-center gap-3 mt-4">
    <a href="{{ url_for('my_orders') }}" class="btn btn-checkout">View My Orders</a>
    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Continue Shopping</a>
  </div>
</div>
{% endblock %}
