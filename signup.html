{% extends "base.html" %}
{% block title %}Sign Up - GymDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="p-4 rounded-4 shadow-sm form-card">
      <h4 class="fw-bold mb-1 text-center">Create Your Account</h4>
      <p class="text-muted text-center mb-4">Join GymDesk as a customer or seller</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">I want to join as</label>
          <div class="d-flex gap-3">
            <div class="form-check role-option flex-fill p-3 rounded-3">
              <input class="form-check-input" type="radio" name="role" value="customer" id="roleCustomer" checked>
              <label class="form-check-label w-100" for="roleCustomer"><i class="bi bi-person"></i> Customer</label>
            </div>
            <div class="form-check role-option flex-fill p-3 rounded-3">
              <input class="form-check-input" type="radio" name="role" value="seller" id="roleSeller">
              <label class="form-check-label w-100" for="roleSeller"><i class="bi bi-shop"></i> Seller</label>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Shop Name <span class="text-muted small">(sellers only)</span></label>
          <input type="text" name="shop_name" class="form-control" placeholder="e.g. Rahul Electronics">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-checkout w-100">Sign Up</button>
      </form>
      <p class="text-center mt-3 mb-0 small">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
