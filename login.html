{% extends "base.html" %}
{% block title %}Login - GymDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="p-4 rounded-4 shadow-sm form-card">
      <h4 class="fw-bold mb-1 text-center">Welcome Back</h4>
      <p class="text-muted text-center mb-4">Login to your GymDesk account</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-checkout w-100">Login</button>
      </form>
      <p class="text-center mt-3 mb-0 small">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
      <hr>
      <p class="small text-muted mb-0">Demo logins:<br>
        Admin: <code>admin / admin123</code><br>
        Seller: <code>rahul_seller / seller123</code><br>
        Customer: <code>priya / customer123</code>
      </p>
    </div>
  </div>
</div>
{% endblock %}
