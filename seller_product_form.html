{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} Product - GymDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="p-4 rounded-4 shadow-sm form-card">
      <h4 class="fw-bold mb-4">{{ 'Edit Product' if product else 'Add New Product' }}</h4>
      <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label">Product Name</label>
          <input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3">{{ product.description if product else '' }}</textarea>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Price (₹)</label>
            <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price if product else '' }}" required>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Stock</label>
            <input type="number" name="stock" class="form-control" value="{{ product.stock if product else '' }}" required>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control" value="{{ product.category if product else 'General' }}">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Upload Image</label>
          <input type="file" name="image" class="form-control" accept="image/*">
        </div>
        <div class="mb-3">
          <label class="form-label">Or Image URL</label>
          <input type="text" name="image_url" class="form-control" value="{{ product.image if product and product.image and 'uploads/' not in product.image else '' }}" placeholder="https://...">
        </div>
        <button type="submit" class="btn btn-checkout w-100">{{ 'Update Product' if product else 'Submit for Approval' }}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
